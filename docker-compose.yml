name: sideagent

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sideagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sideagent}
      POSTGRES_DB: ${POSTGRES_DB:-sideagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The admin: dashboard, API and agent endpoints.
  #   docker compose up
  # Set BETTER_AUTH_SECRET and CONFIG_KEK (openssl rand -base64 32) in .env, or it uses throwaway ones.
  # Sign-in links are printed in this service's logs: docker compose logs -f admin
  admin:
    build:
      context: .
      target: admin
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sideagent}:${POSTGRES_PASSWORD:-sideagent}@db:5432/${POSTGRES_DB:-sideagent}
      PORT: "8788"
      PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8788}
    ports:
      - "${ADMIN_PORT:-8788}:8788"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
