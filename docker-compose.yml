name: sideagent-demo

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sideagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sideagent}
      POSTGRES_DB: ${POSTGRES_DB:-sideagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sideagent}:${POSTGRES_PASSWORD:-sideagent}@db:5432/${POSTGRES_DB:-sideagent}
      PG_VECTOR_TABLE: ${PG_VECTOR_TABLE:-sideagent_chunks}
      DEMO_ORIGINS: ${DEMO_ORIGINS:-http://localhost:8080,http://localhost:8787,http://localhost:5173}
    ports:
      - "${API_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
